{% load i18n %}
{% for field in form %}
    <div class="form-field">
        {{ field.errors }}
        <label for="{{ field.id_for_label }}">
            {{ field.label }}
            {% if not field.field.required %}
                <span class="optional">{% translate "optional" %}</span>
            {% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}
            <div class="helptext">{{ field.help_text }}</div>
        {% endif %}
    </div>
{% endfor %}

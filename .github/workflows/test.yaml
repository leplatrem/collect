name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: make install

    - name: Lint
      run: make lint

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: make install

    - name: Compile translation files
      run: |
        sudo apt-get install gettext
        uv run django-admin compilemessages --ignore .venv

    - name: Run tests
      run: make test

  end2end:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Prepare folders
      run: |
        mkdir -p media-folder/uploads
        chmod -R 777 media-folder
        cp env.local .env

    - name: Build Docker container
      run: docker compose build

    - name: Initialize database
      run: docker compose run init

    - name: Run application containers
      run: docker compose up -d

    - name: Check app liveliness
      run: |
        for i in {1..150}; do
          if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/health/; then
            exit 0
          fi
          echo "Waiting for app to start ($i/150)..."
          sleep 2
        done
        echo "App did not start listening on port 8000 within 5 minutes." >&2
        docker compose logs web
        exit 1

    - name: Check app readiness
      run: |
        for i in {1..150}; do
          if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/readiness/; then
            exit 0
          fi
          echo "Waiting for app to be ready ($i/150)..."
          sleep 2
        done
        echo "App did not become ready within 5 minutes." >&2
        docker compose logs web
        exit 1

    - name: Add demo data
      run: docker compose run demo

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Run Playwright Tests
      run: make browser-test

    - name: Show app logs
      if: failure()
      run: docker compose logs -n 1000 web || true

    - name: Upload Playwright test artifacts
      uses: actions/upload-artifact@v7
      with:
        name: playwright-artifacts
        path: test-results/

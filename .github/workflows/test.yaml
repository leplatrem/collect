name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: make install

    - name: Lint
      run: make lint

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: make install

    - name: Run tests
      run: make test

  end2end:
    runs-on: ubuntu-latest
    needs: [test]

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: collectdb
          POSTGRES_USER: dbuser
          POSTGRES_PASSWORD: dbpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_DATABASE_URL: postgres://dbuser:dbpassword@db:5432/collectdb

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker container
      run: docker build -t collect-app .

    - name: Initialize database
      run: |
        docker run --rm \
          -e DJANGO_DATABASE_URL=${DJANGO_DATABASE_URL} \
          collect-app \
          uv run manage.py migrate
        docker run --rm \
          -e DJANGO_DATABASE_URL=${DJANGO_DATABASE_URL} \
          collect-app \
          uv run manage.py smart_create_user testuser testpass

    - name: Run container
      run: |
        docker run --detach -p 8000:8000 --name test-collect-app \
          -e DJANGO_DEBUG=false \
          -e DJANGO_DATABASE_URL=${DJANGO_DATABASE_URL} \
          collect-app

    - name: Check readiness
      run: |
        curl --fail --retry-all-errors \
          --retry 10 \
          http://localhost:8000/

    - name: Set up Python
      uses: actions/setup-python@v4

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: make install

    - name: Run Playwright Tests
      run: make browser-test

    - name: Upload Playwright test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: playwright-artifacts
        path: test-results/

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName  collect.domain
    ServerAdmin collect@mcollect.domain

    DocumentRoot /var/www/collect.domain

    <LocationMatch "^/(?!media).*$">
        ProxyPreserveHost on
        ProxyPass http://localhost:10001
        ProxyPassReverse http://localhost:10001
        RequestHeader set "X-Forwarded-Proto" expr=%{REQUEST_SCHEME} early
        RequestHeader set "X-Forwarded-SSL" expr=%{HTTPS} early
    </LocationMatch>

    Alias /media /var/lib/docker/volumes/collect_media-folder/_data/uploads
    <Directory /var/lib/docker/volumes/collect_media-folder/_data/uploads>
       Require all granted
       Header set Cache-Control "max-age=3600, public"

       # These files are uploaded by users and served from the same origin as
       # the application, so any file that the browser agrees to render as a
       # document (.html, .svg, ...) would run with access to the visitor's
       # session cookie. Never guess the type, isolate whatever gets rendered,
       # and hand files over as a download unless they are photos.
       Header always set X-Content-Type-Options "nosniff"
       Header always set Content-Security-Policy "sandbox"
       Header always set Content-Disposition "attachment"
       <FilesMatch "\.(jpe?g|png)$">
          Header always set Content-Disposition "inline"
       </FilesMatch>
    </Directory>
 
    ErrorLog ${APACHE_LOG_DIR}/error-collect.domain.log

    # Possible values include: debug, info, notice, warn, error, crit,
    # alert, emerg.
    LogLevel info
    CustomLog ${APACHE_LOG_DIR}/access-collect.domain.log combined

    RewriteEngine on

    SSLCertificateFile /etc/letsencrypt/live/collect.domain/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/collect.domain/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
